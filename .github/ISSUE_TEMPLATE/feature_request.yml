name: Feature Request
description: Suggest an idea or enhancement for tsql-scriptdom-java
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep in mind that `tsql-scriptdom-java` aims to maintain fidelity with Microsoft SqlScriptDOM.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or enhancement.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Motivation / Use Case
      description: Explain why this feature is useful (e.g. SonarQube plugin rule, custom AST visitor, linter support).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
