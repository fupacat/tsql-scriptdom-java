name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Extract Javadocs
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "${LATEST_TAG}" ]; then
            DOC_VERSION="${LATEST_TAG#v}"
            mvn versions:set -DnewVersion="${DOC_VERSION}" -DgenerateBackupPoms=false --batch-mode
          fi
          mvn package -P release -DskipTests --batch-mode
          mkdir -p apidocs-site
          JAR_FILE=$(ls ./tsql-scriptdom-core/target/*-javadoc.jar | head -n 1)
          unzip -q "${JAR_FILE}" -d apidocs-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Javadoc Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apidocs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
